name: DentalCAD R12 Strict Synthetic Validation

on:
  push:
    branches:
      - r12-audit-import-2026-11-10
      - r12-fresh-evidence-2026-11-10
      - r12-physical-phantom-validation-2026-11-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-docker-campaign:
    name: R12 isolated strict campaign
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose
        working-directory: dentalcad_v1.7.9_work
        run: |
          docker --version
          docker compose version
          docker compose -f docker-compose.validation.yml config --quiet

      - name: Prepare isolated evidence directory
        working-directory: dentalcad_v1.7.9_work
        run: |
          rm -rf research/validation/run_logs
          mkdir -p research/validation/run_logs
          chmod 0777 research/validation/run_logs
          {
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > research/validation/run_logs/RUN_METADATA.txt

      - name: Build validation image
        working-directory: dentalcad_v1.7.9_work
        run: |
          docker compose \
            -f docker-compose.validation.yml \
            build --no-cache r12-campaign

      - name: Execute strict synthetic campaign
        working-directory: dentalcad_v1.7.9_work
        run: |
          docker compose \
            -f docker-compose.validation.yml \
            up --abort-on-container-exit \
            --exit-code-from r12-campaign r12-campaign

      - name: Require explicit strict PASS
        if: always()
        run: |
          STATUS="dentalcad_v1.7.9_work/research/validation/run_logs/CAMPAIGN_STATUS.txt"
          test -f "$STATUS"
          test "$(tr -d '\r\n' < "$STATUS")" = "R12_STRICT_CAMPAIGN_PASS"

      - name: Generate final evidence verdict
        if: always()
        working-directory: dentalcad_v1.7.9_work
        run: |
          LOG="research/validation/run_logs"
          STATUS="$LOG/CAMPAIGN_STATUS.txt"
          VERDICT="$LOG/FINAL_VERDICT.txt"

          RESULT="FAIL"

          if test -f "$STATUS" &&
             test "$(tr -d '\r\n' < "$STATUS")" = "R12_STRICT_CAMPAIGN_PASS" &&
             test -s "$LOG/pytest_synthetic.txt" &&
             test -s "$LOG/pytest_production.txt" &&
             test -s "$LOG/mesh_production.json" &&
             test ! -f "$LOG/strict_mode_failure.txt" &&
             test ! -f "$LOG/production_dependencies.txt" &&
             ! grep -Eiq '(^|[ ,])[0-9]+ skipped|SKIPPED|ModuleNotFoundError|ImportError' "$LOG/pytest_synthetic.txt" &&
             ! grep -Eiq '(^|[ ,])[0-9]+ skipped|SKIPPED|ModuleNotFoundError|ImportError' "$LOG/pytest_production.txt" &&
             python -m json.tool "$LOG/mesh_production.json" >/dev/null; then
            RESULT="PASS"
          fi

          {
            echo "R12_FINAL_VERDICT=$RESULT"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "FINISHED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$VERDICT"

          cat "$VERDICT"
          test "$RESULT" = "PASS"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dentalcad-r12-strict-validation-evidence
          path: dentalcad_v1.7.9_work/research/validation/run_logs/
          if-no-files-found: warn

      - name: Stop temporary containers
        working-directory: dentalcad_v1.7.9_work
        if: always()
        run: |
          docker compose \
            -f docker-compose.validation.yml \
            down --volumes --remove-orphans
