name: DentalCAD R12 Bot Workers

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: dentalcad-r12-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coding-agent-tests:
    name: Worker A — code and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Core prosthetic and registration tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_prosthetic.py
          backend/tests/test_implant_plan_schema.py
          backend/tests/test_registration_math.py
          backend/tests/test_guide_ray_check.py
          backend/tests/test_upload_helpers_source_isolated.py
      - name: JavaScript syntax
        run: node --check frontend/app.js

  independent-validation-bot:
    name: Worker B — independent geometry and metrology audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Independent geometry, orientation and metrology tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_nonclinical_lab_label.py
          backend/tests/test_viewer_geometry.py
          backend/tests/test_viewer_orientation.py
          backend/tests/test_metrology_benchmarks.py
      - name: Registration benchmark matrix
        run: python research/validation/benchmark_registration_matrix.py
      - name: Mesh benchmark
        run: python research/validation/benchmark_mesh.py

  dependency-security-audit:
    name: Worker C — dependency and security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install audit tools
        run: python -m pip install --upgrade pip pip-audit
      - name: Verify bcrypt pin remains explicit
        run: grep -Fx 'bcrypt==4.0.1' backend/requirements.txt
      - name: Audit pinned runtime dependencies
        run: pip-audit -r backend/requirements.txt

  strict-docker-campaign:
    name: Worker D — isolated strict synthetic campaign
    runs-on: ubuntu-latest
    needs: [coding-agent-tests, independent-validation-bot, dependency-security-audit]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.validation.yml config --quiet
      - name: Build strict validation image
        run: docker compose -f docker-compose.validation.yml build --no-cache r12-campaign
      - name: Run strict synthetic campaign
        run: docker compose -f docker-compose.validation.yml up --abort-on-container-exit --exit-code-from r12-campaign
      - name: Require explicit strict pass status
        if: always()
        run: |
          test -f research/validation/run_logs/CAMPAIGN_STATUS.txt
          test "$(tr -d '\r\n' < research/validation/run_logs/CAMPAIGN_STATUS.txt)" = 'R12_STRICT_CAMPAIGN_PASS'
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dentalcad-r12-strict-validation-evidence
          path: research/validation/run_logs/
          if-no-files-found: warn
